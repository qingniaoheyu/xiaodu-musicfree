<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小度 · 我的音乐</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36;
    --fg:#eef1f6; --dim:#8b93a7; --accent:#4c8dff; --accent2:#7a5cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}

  header{padding:14px 20px 10px;flex:0 0 auto;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .brand h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.5px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:#2ecc71;box-shadow:0 0 10px #2ecc71}
  .brand small{color:var(--dim);font-size:12px;margin-left:auto}

  .searchbar{display:flex;gap:10px}
  .searchbar input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:12px 16px;color:var(--fg);font-size:17px;outline:none}
  .searchbar input:focus{border-color:var(--accent)}
  .searchbar button{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;
    border-radius:12px;padding:0 20px;color:#fff;font-size:17px;font-weight:600;cursor:pointer}
  .searchbar button:active{opacity:.85}

  main{flex:1 1 auto;overflow-y:auto;padding:16px 20px 130px}
  main::-webkit-scrollbar{width:6px}
  main::-webkit-scrollbar-thumb{background:#2b3242;border-radius:3px}

  .hint{color:var(--dim);font-size:14px;line-height:1.9}
  .hint b{color:var(--fg)}

  .row{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:14px;
    background:var(--panel);margin-bottom:10px;cursor:pointer;border:1px solid transparent}
  .row:active{background:#1e222c}
  .row.playing{border-color:var(--accent);background:#1a2130}
  .row .idx{width:26px;text-align:center;color:var(--dim);font-size:15px;flex:0 0 auto}
  .row.playing .idx{color:var(--accent)}
  .row .meta{flex:1;min-width:0}
  .row .t{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .a{font-size:13px;color:var(--dim);margin-top:3px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .row .tag{font-size:11px;color:#f0b429;border:1px solid #4a3a12;background:#2a2110;
    padding:2px 7px;border-radius:6px;flex:0 0 auto}
  .row .eq{display:none;gap:2px;align-items:flex-end;height:16px;flex:0 0 auto}
  .row.playing .eq{display:flex}
  .eq i{width:3px;background:var(--accent);border-radius:2px;animation:bar .9s infinite ease-in-out}
  .eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
  @keyframes bar{0%,100%{height:5px}50%{height:16px}}

  footer{position:fixed;left:0;right:0;bottom:0;background:rgba(20,23,30,.96);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 20px 16px}
  .now{display:flex;align-items:center;gap:14px}
  .now .cover{width:48px;height:48px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(135deg,#2a3550,#1b2030);display:flex;align-items:center;
    justify-content:center;font-size:22px}
  .now .info{flex:1;min-width:0}
  .now .info .t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now .info .a{font-size:12px;color:var(--dim);margin-top:2px}
  .now .ctrl{display:flex;gap:10px}
  .now .ctrl button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--fg);font-size:18px;cursor:pointer}
  .now .ctrl button.main{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0}
  .bar{height:3px;background:#252b38;border-radius:2px;margin-top:12px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}

  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(20,23,30,.96);border:1px solid var(--line);color:var(--fg);
    padding:14px 22px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;
    transition:opacity .25s;z-index:99;max-width:80%;text-align:center}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>我的音乐</h1>
      <small id="stat">连接中…</small>
    </div>
    <div class="searchbar">
      <input id="q" type="search" placeholder="搜歌名或歌手，例如：晴天" autocomplete="off">
      <button id="go">搜索</button>
    </div>
  </header>

  <main id="list">
    <div class="hint">
      说 <b>「小度小度，打开我的音乐」</b> 进入本页。<br>
      可以直接在搜索框输入，或者点下面的推荐。
    </div>
  </main>

  <footer>
    <div class="now">
      <div class="cover">♪</div>
      <div class="info">
        <div class="t" id="curT">未在播放</div>
        <div class="a" id="curA">选一首歌开始</div>
      </div>
      <div class="ctrl">
        <button id="prev" title="上一首">⏮</button>
        <button id="play" class="main" title="播放/暂停">▶</button>
        <button id="next" title="下一首">⏭</button>
      </div>
    </div>
    <div class="bar"><i id="prog"></i></div>
  </footer>
</div>
<div id="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script>
(function () {
  'use strict';

  var API = location.origin;
  var listEl = document.getElementById('list');
  var qEl = document.getElementById('q');
  var statEl = document.getElementById('stat');
  var audio = document.getElementById('audio');
  var curT = document.getElementById('curT');
  var curA = document.getElementById('curA');
  var prog = document.getElementById('prog');
  var playBtn = document.getElementById('play');

  var queue = [];
  var index = -1;
  var toastTimer = null;

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render(items) {
    if (!items.length) {
      listEl.innerHTML = '<div class="hint">没有找到歌。<br>换个关键词试试，或者确认曲库目录里有没有文件。</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      html += '<div class="row" data-i="' + i + '">'
        + '<div class="idx">' + (i + 1) + '</div>'
        + '<div class="meta"><div class="t">' + esc(it.title) + '</div>'
        + '<div class="a">' + esc(it.artist) + (it.album ? ' · ' + esc(it.album) : '') + '</div></div>'
        + (it.needsTranscode ? '<span class="tag">需转码</span>' : '')
        + '<div class="eq"><i></i><i></i><i></i></div>'
        + '</div>';
    }
    listEl.innerHTML = html;
  }

  function markPlaying() {
    var rows = listEl.querySelectorAll('.row');
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle('playing', Number(rows[i].dataset.i) === index);
    }
  }

  function search(kw, autoPlay) {
    var url = API + '/api/search?limit=50&q=' + encodeURIComponent(kw || '');
    statEl.textContent = '搜索中…';
    fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      queue = d.data || [];
      index = -1;
      render(queue);
      statEl.textContent = '共 ' + (d.total || 0) + ' 首，命中 ' + queue.length + ' 首';
      if (autoPlay) {
        if (queue.length) {
          playAt(0);
          if (window.botApp && window.botApp.speak) {
            try { window.botApp.speak('为你播放' + queue[0].title); } catch (e) {}
          }
        } else if (window.botApp && window.botApp.speak) {
          try { window.botApp.speak('曲库里没有找到这首歌'); } catch (e) {}
        }
      }
    }).catch(function (e) {
      statEl.textContent = '搜索失败';
      toast('搜索失败：' + e.message);
    });
  }

  function playAt(i) {
    if (i < 0 || i >= queue.length) { return; }
    index = i;
    var it = queue[i];
    curT.textContent = it.title;
    curA.textContent = it.artist;
    markPlaying();
    statEl.textContent = '加载中…';

    fetch(API + '/api/playurl/' + encodeURIComponent(it.id))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) { throw new Error(d.error || '取流失败'); }
        audio.src = d.url;
        audio.play().then(function () {
          playBtn.textContent = '❚❚';
          statEl.textContent = d.transcoded ? '已转码播放' : '正在播放';
        }).catch(function () {
          toast('浏览器拦了自动播放，点一下播放按钮');
          playBtn.textContent = '▶';
        });
      })
      .catch(function (e) {
        toast(e.message);
        statEl.textContent = '播放失败';
      });
  }

  listEl.addEventListener('click', function (e) {
    var row = e.target.closest ? e.target.closest('.row') : null;
    if (!row) { return; }
    playAt(Number(row.dataset.i));
  });

  document.getElementById('go').addEventListener('click', function () { search(qEl.value.trim()); });
  qEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { search(qEl.value.trim()); } });

  playBtn.addEventListener('click', function () {
    if (audio.paused) {
      if (!audio.src) { playAt(index < 0 ? 0 : index); return; }
      audio.play().then(function () { playBtn.textContent = '❚❚'; }).catch(function () {});
    } else {
      audio.pause();
      playBtn.textContent = '▶';
    }
  });

  document.getElementById('next').addEventListener('click', function () {
    if (!queue.length) { return; }
    playAt((index + 1) % queue.length);
  });
  document.getElementById('prev').addEventListener('click', function () {
    if (!queue.length) { return; }
    playAt((index - 1 + queue.length) % queue.length);
  });

  audio.addEventListener('ended', function () {
    if (queue.length > 1) { playAt((index + 1) % queue.length); }
    else { playBtn.textContent = '▶'; }
  });
  audio.addEventListener('timeupdate', function () {
    if (audio.duration > 0) { prog.style.width = (audio.currentTime / audio.duration * 100) + '%'; }
  });
  audio.addEventListener('error', function () {
    statEl.textContent = '播放出错';
    toast('这个文件放不了，试试别的');
  });

  // 初始化：拉一次全量
  fetch(API + '/api/health').then(function (r) { return r.json(); }).then(function (d) {
    statEl.textContent = '曲库 ' + d.tracks + ' 首';
    search('');
  }).catch(function () {
    statEl.textContent = '服务未连接';
  });

  // ---- 小度 H5 技能 SDK ----
  // 首次创建技能时签名 Key 还没填入，__BOT_APP_CONFIG__ 为 null：
  // 页面会安静降级成「纯触屏」模式，不会报错，也不影响播放。
  // 拿到 skillID / 签名 Key 后，把配置填进下面这个对象即可启用语音。
  window.__BOT_APP_CONFIG__ = null;

  window.__xiaoduH5Ready = false;
  window.botApp = null;

  (function initBot() {
    var cfg = window.__BOT_APP_CONFIG__;
    if (!window.BotApp || !cfg || !cfg.skillID) { return; }
    try {
      var app = new window.BotApp(cfg);
      window.botApp = app;
      window.__xiaoduH5Ready = true;

      // 平台配置好的意图（如「下一首」「暂停」）
      if (app.onHandleIntent) {
        app.onHandleIntent(function (payload) {
          var p = payload || {};
          var name = ((p.intent || {}).name) || '';
          var slots = ((p.intent || {}).slots) || [];
          var song = '';
          for (var i = 0; i < slots.length; i++) {
            var s = slots[i] || {};
            if (s.name === 'song' || /song|keyword|query/i.test(s.name || '')) {
              try {
                var v = s.value;
                var parsed = typeof v === 'string' && v.charAt(0) === '{' ? JSON.parse(v) : null;
                song = parsed && (parsed.song || parsed.origin || parsed.value) ? (parsed.song || parsed.origin || parsed.value) : String(v || '');
              } catch (e) { song = String(s.value || ''); }
              break;
            }
          }
          if (song) { search(song, true); return; }
          if (/next|下一首/i.test(name)) { document.getElementById('next').click(); }
          else if (/prev|上一首/i.test(name)) { document.getElementById('prev').click(); }
          else if (/pause|stop|暂停|停止/i.test(name)) { audio.pause(); playBtn.textContent = '▶'; }
          else if (/continue|resume|继续|播放/i.test(name)) { audio.play().catch(function () {}); }
        });
      }

      // 未配词典的话，用 ASR 原文兜底：用户说什么就当歌名搜
      if (app.updateUiContext && app.onHandleUnknowUtterance) {
        try {
          app.updateUiContext({ enableGeneralUtterances: false, hyperUtterances: [] });
          app.onHandleUnknowUtterance(function (err, data) {
            var q = ((data || {}).query || '').trim();
            if (!q) { return; }
            // 去掉常见口令前缀
            q = q.replace(/^(小度小度[,，]?\s*)?(请|帮我|给我|来一首|放一首|播放|放|听|搜一下|搜索)\s*/, '').trim();
            if (q) { search(q, true); }
          });
        } catch (e) {}
      }

      if (app.speak) {
        try { app.speak('音乐已就绪，说出歌名就能播放'); } catch (e) {}
      }
    } catch (e) {
      statEl.textContent = 'SDK 初始化失败，可用触屏';
    }
  })();
})();
</script>
</body>
</html>
